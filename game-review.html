<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Discord Game Review — две вкладки: оценка + сохранённые</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #a55ef0 0%, #6c2bd9 35%, #3b0b6b 100%);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Roboto', sans-serif;
            padding: 2rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* главная карточка */
        .review-card {
            max-width: 1350px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(0px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.2);
            padding: 2rem 2rem 2rem;
            transition: all 0.2s ease;
        }

        @media (max-width: 720px) {
            body { padding: 1rem; }
            .review-card { padding: 1.5rem; }
        }

        /* стили вкладок (табы) */
        .tabs-container {
            display: flex;
            gap: 0.8rem;
            border-bottom: 2px solid #e0ceff;
            margin-bottom: 1.8rem;
            padding-bottom: 0;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.8rem 1.6rem;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 2rem 2rem 0 0;
            color: #3f1d6b;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            letter-spacing: -0.2px;
            background: #f1eaff;
            margin-bottom: -2px;
            border: 1px solid transparent;
        }
        .tab-btn.active {
            background: white;
            color: #7b2eda;
            border-top: 2px solid #a55ef0;
            border-left: 1px solid #e2d0ff;
            border-right: 1px solid #e2d0ff;
            border-bottom: 2px solid white;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.02);
        }
        .tab-btn:hover:not(.active) {
            background: #e7daff;
            color: #4e1c96;
        }
        .tab-content {
            display: none;
            animation: fade 0.2s ease;
        }
        .tab-content.active-tab {
            display: block;
        }
        @keyframes fade {
            from { opacity: 0; transform: translateY(5px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* остальные старые стили (критерии, ползунки) — адаптируем */
        .discord-header {
            text-align: center;
            margin-bottom: 1rem;
        }
        .discord-header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #7b2eda, #3f0c7a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        @media (max-width: 550px) {
            .discord-header h1 { font-size: 1.7rem; }
        }

        .game-title-section {
            margin-bottom: 1.8rem;
            text-align: center;
        }
        .game-label {
            font-weight: 600;
            color: #2e0c47;
            display: block;
            margin-bottom: 0.5rem;
        }
        #gameNameInput {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border: 2px solid #e2d0ff;
            border-radius: 60px;
            background: white;
            font-weight: 500;
            color: #2d0d48;
            transition: 0.2s;
            text-align: center;
        }
        #gameNameInput:focus {
            border-color: #9b4dff;
            box-shadow: 0 0 0 3px rgba(155, 77, 255, 0.2);
            outline: none;
        }

        .criteria-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.2rem 2rem;
            margin: 1.8rem 0 1.8rem;
        }
        @media (max-width: 780px) {
            .criteria-grid { grid-template-columns: 1fr; }
        }
        .criterion-card {
            background: #faf7ff;
            border-radius: 1.6rem;
            padding: 0.9rem 1rem 1rem;
            border: 1px solid #f0e6ff;
        }
        .criterion-name {
            font-weight: 700;
            font-size: 1rem;
            color: #2b0d42;
            display: flex;
            gap: 6px;
            margin-bottom: 0.7rem;
            border-left: 4px solid #a45eff;
            padding-left: 10px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        input[type="range"] {
            flex: 1;
            min-width: 140px;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #bc8cff, #6a2bd0);
            border-radius: 10px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            border: 2px solid #6b2ad0;
            cursor: pointer;
        }
        .value-display {
            background: #f0e7ff;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #3f1a6e;
            min-width: 52px;
            text-align: center;
            font-family: monospace;
        }
        .total-section {
            background: linear-gradient(120deg, #f1eaff, #ffffff);
            border-radius: 1.8rem;
            padding: 1rem 1.5rem;
            text-align: center;
            margin: 1rem 0 1.2rem;
        }
        .total-score {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #5429a3, #8a3eff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .total-max {
            font-size: 1.1rem;
            color: #6e53a3;
        }
        .reset-btn, .save-review-btn, .clear-all-btn {
            background: #f0e6ff;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            color: #571dc9;
            cursor: pointer;
            transition: 0.2s;
            margin: 0.2rem 0.3rem;
        }
        .save-review-btn {
            background: #9b4dff;
            color: white;
            box-shadow: 0 2px 8px rgba(107, 42, 208, 0.3);
        }
        .save-review-btn:hover {
            background: #7c2ee0;
            transform: scale(0.98);
        }
        .reset-btn:hover, .clear-all-btn:hover {
            background: #e0d0ff;
        }

        /* Стили для списка сохранённых игр */
        .saved-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 1rem;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .saved-game-card {
            background: #f9f5ff;
            border-radius: 1.4rem;
            padding: 1rem 1.2rem;
            border: 1px solid #e5d5ff;
            transition: 0.1s;
        }
        .saved-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 0.6rem;
        }
        .saved-game-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: #30115e;
            word-break: break-word;
        }
        .saved-total {
            font-weight: 700;
            background: #e2d0fc;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.9rem;
        }
        .saved-details {
            font-size: 0.8rem;
            color: #5b408b;
            margin-bottom: 0.6rem;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .scores-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0;
            font-size: 0.7rem;
        }
        .score-badge {
            background: #ede3ff;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
        }
        .saved-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .load-review-btn, .delete-review-btn {
            background: #e9dfff;
            border: none;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
        }
        .load-review-btn { background: #cfb8ff; color: #321769; }
        .delete-review-btn { background: #ffe0e0; color: #b0003a; }
        .load-review-btn:hover { background: #b992ff; }
        .delete-review-btn:hover { background: #ffc2c2; }
        .empty-placeholder {
            text-align: center;
            padding: 2rem;
            color: #846bb3;
            font-weight: 500;
        }
        hr {
            margin: 5px 0;
            border-color: #e2d0fc;
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 0.5rem;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #b49af0;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

<div class="review-card">
    <div class="discord-header">
        <h1>🎮 DISCORD GAME REVIEW</h1>
    </div>

    <!-- Вкладки -->
    <div class="tabs-container">
        <button class="tab-btn active" data-tab="tabRating">⭐ Оценка игры</button>
        <button class="tab-btn" data-tab="tabSaved">📚 Сохранённые обзоры</button>
    </div>

    <!-- ================= ВКЛАДКА 1: ОЦЕНКА ================= -->
    <div id="tabRating" class="tab-content active-tab">
        <div class="game-title-section">
            <span class="game-label">🏷️ НАЗВАНИЕ ИГРЫ</span>
            <input type="text" id="gameNameInput" placeholder="Например: Silent Hill 2, Balatro, Metaphor..." autocomplete="off">
        </div>

        <div id="criteriaContainer" class="criteria-grid"></div>

        <div class="total-section">
            <div class="total-label">✨ ИТОГОВАЯ ОЦЕНКА ✨</div>
            <div>
                <span class="total-score" id="totalScoreDisplay">0.0</span>
                <span class="total-max">/ 10.0</span>
            </div>
            <div style="font-size: 0.75rem; margin-top: 5px;">сумма 10 критериев (каждый 0–1)</div>
            <div style="margin-top: 12px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                <button class="reset-btn" id="resetAllBtn">⟳ Сбросить на 0.5</button>
                <button class="save-review-btn" id="saveReviewBtn">💾 Сохранить оценку</button>
            </div>
        </div>
    </div>

    <!-- ================= ВКЛАДКА 2: СОХРАНЁННЫЕ ИГРЫ ================= -->
    <div id="tabSaved" class="tab-content">
        <div class="action-bar">
            <button id="clearAllReviewsBtn" class="clear-all-btn">🗑 Очистить все обзоры</button>
        </div>
        <div id="savedReviewsContainer" class="saved-list">
            <div class="empty-placeholder">✨ Здесь появятся сохранённые рецензии</div>
        </div>
    </div>
    <footer>ползунки с шагом 0.1 — сохраняйте оценки, данные хранятся в браузере</footer>
</div>

<script>
    // ---------- СПИСОК КРИТЕРИЕВ (10 пунктов) ----------
    const CRITERIA = [
        "Идея и реализация", "Сеттинг", "Арт дизайн", "Геймплей",
        "Техническое состояние", "Графика", "Сюжет", "Духота",
        "Музыка", "Наполненность игры"
    ];

    // Глобальные ссылки
    let sliderElements = [];     // { input, valueSpan }
    const container = document.getElementById("criteriaContainer");
    const totalSpan = document.getElementById("totalScoreDisplay");
    const gameNameInput = document.getElementById("gameNameInput");

    // ---------- Функции работы с локальным хранилищем ----------
    const STORAGE_KEY = "discord_game_reviews";

    function loadReviewsFromStorage() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (!stored) return [];
        try {
            return JSON.parse(stored);
        } catch(e) { return []; }
    }

    function saveReviewsToStorage(reviews) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
    }

    // Добавить новый обзор (текущие значения + имя игры)
    function addCurrentReview() {
        let gameName = gameNameInput.value.trim();
        if (gameName === "") {
            gameName = "Без названия";
        }
        // собираем оценки из слайдеров
        const scores = sliderElements.map(slider => {
            let val = parseFloat(slider.input.value);
            return isNaN(val) ? 0 : val;
        });
        if (scores.length !== 10) return false;
        const total = scores.reduce((a,b) => a + b, 0);
        const review = {
            id: Date.now() + Math.random() * 10000,
            gameName: gameName,
            scores: scores,
            totalScore: total,
            timestamp: new Date().toLocaleString()
        };
        const reviews = loadReviewsFromStorage();
        reviews.unshift(review); // новый сверху
        saveReviewsToStorage(reviews);
        return true;
    }

    // удалить обзор по id
    function deleteReviewById(id) {
        let reviews = loadReviewsFromStorage();
        reviews = reviews.filter(r => r.id != id);
        saveReviewsToStorage(reviews);
        renderSavedReviews();    // обновить отображение вкладки
    }

    // загрузить обзор в форму (вкладка "оценка")
    function loadReviewIntoForm(review) {
        // Устанавливаем имя игры
        gameNameInput.value = review.gameName;
        // Устанавливаем значения слайдеров
        if (review.scores && review.scores.length === 10) {
            for (let i = 0; i < sliderElements.length; i++) {
                let val = review.scores[i];
                val = Math.min(1, Math.max(0, val));
                // Округление до 0.1 (шаг)
                val = Math.round(val * 10) / 10;
                sliderElements[i].input.value = val;
                updateValueDisplay(sliderElements[i]);
            }
        }
        updateTotalScore();
        // переключиться на вкладку оценки, чтобы видеть результат
        activateTab('tabRating');
    }

    // отрисовать список сохранённых игр
    function renderSavedReviews() {
        const containerDiv = document.getElementById("savedReviewsContainer");
        if (!containerDiv) return;
        const reviews = loadReviewsFromStorage();
        if (reviews.length === 0) {
            containerDiv.innerHTML = `<div class="empty-placeholder">📭 Пока нет сохранённых оценок. Оцените игру и нажмите «Сохранить».</div>`;
            return;
        }
        let html = "";
        reviews.forEach(review => {
            const totalFixed = review.totalScore.toFixed(1);
            // генерируем превью первых 5 оценок для краткости
            const scoresPreview = review.scores.map((s, idx) => `<span class="score-badge">${CRITERIA[idx].slice(0,12)}: ${s.toFixed(1)}</span>`).join('');
            html += `
                <div class="saved-game-card" data-id="${review.id}">
                    <div class="saved-header">
                        <span class="saved-game-name">🎮 ${escapeHtml(review.gameName)}</span>
                        <span class="saved-total">⭐ ${totalFixed} / 10.0</span>
                    </div>
                    <div class="saved-details">📅 ${escapeHtml(review.timestamp)}</div>
                    <div class="scores-preview">
                        ${scoresPreview}
                    </div>
                    <div class="saved-buttons">
                        <button class="load-review-btn" data-id="${review.id}">📂 Загрузить в редактор</button>
                        <button class="delete-review-btn" data-id="${review.id}">❌ Удалить</button>
                    </div>
                </div>
            `;
        });
        containerDiv.innerHTML = html;
        // навесить обработчики на кнопки загрузки/удаления
        document.querySelectorAll('.load-review-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = Number(btn.getAttribute('data-id'));
                const reviewsArr = loadReviewsFromStorage();
                const found = reviewsArr.find(r => r.id === id);
                if (found) loadReviewIntoForm(found);
            });
        });
        document.querySelectorAll('.delete-review-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = Number(btn.getAttribute('data-id'));
                deleteReviewById(id);
            });
        });
    }

    // Простой экранинг для безопасности
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // очистить все обзоры
    function clearAllReviews() {
        if (confirm("Вы уверены? Все сохранённые рецензии будут удалены навсегда.")) {
            localStorage.removeItem(STORAGE_KEY);
            renderSavedReviews();
        }
    }

    // ---------- Логика ползунков и итога ----------
    function updateTotalScore() {
        let sum = 0;
        for (let item of sliderElements) {
            let v = parseFloat(item.input.value);
            if (isNaN(v)) v = 0;
            sum += v;
        }
        totalSpan.textContent = sum.toFixed(1);
        return sum;
    }

    function updateValueDisplay(sliderObj) {
        let val = parseFloat(sliderObj.input.value);
        if (isNaN(val)) val = 0;
        sliderObj.valueSpan.textContent = val.toFixed(1);
    }

    function onSliderChange(sliderObj) {
        return function() {
            updateValueDisplay(sliderObj);
            updateTotalScore();
        };
    }

    function setAllValuesTo(value) {
        for (let item of sliderElements) {
            item.input.value = value;
            updateValueDisplay(item);
        }
        updateTotalScore();
    }

    // генерация интерфейса критериев
    function buildRatingInterface() {
        container.innerHTML = '';
        sliderElements = [];
        CRITERIA.forEach((criterionName, idx) => {
            const criterionDiv = document.createElement('div');
            criterionDiv.className = 'criterion-card';
            const nameSpan = document.createElement('div');
            nameSpan.className = 'criterion-name';
            const emojis = ["💡", "🌍", "🎨", "🎮", "⚙️", "🖼️", "📖", "🔥", "🎵", "📦"];
            nameSpan.innerHTML = `${emojis[idx % emojis.length]} ${criterionName}`;
            const sliderWrap = document.createElement('div');
            sliderWrap.className = 'slider-container';
            const rangeInput = document.createElement('input');
            rangeInput.type = 'range';
            rangeInput.min = 0;
            rangeInput.max = 1;
            rangeInput.step = 0.1;
            rangeInput.value = 0.5;
            const valueSpan = document.createElement('span');
            valueSpan.className = 'value-display';
            valueSpan.textContent = '0.5';
            const sliderObj = { input: rangeInput, valueSpan: valueSpan };
            rangeInput.addEventListener('input', onSliderChange(sliderObj));
            sliderWrap.appendChild(rangeInput);
            sliderWrap.appendChild(valueSpan);
            criterionDiv.appendChild(nameSpan);
            criterionDiv.appendChild(sliderWrap);
            container.appendChild(criterionDiv);
            sliderElements.push(sliderObj);
        });
        updateTotalScore();
    }

    // ---------- Управление вкладками ----------
    function activateTab(tabId) {
        // скрыть все контенты
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active-tab');
        });
        document.getElementById(tabId).classList.add('active-tab');
        // обновить активную кнопку
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-tab') === tabId) {
                btn.classList.add('active');
            }
        });
        // если переключились на вкладку сохранённых — перерисовать актуальный список
        if (tabId === 'tabSaved') {
            renderSavedReviews();
        }
    }

    // сохранение текущей оценки
    function handleSaveReview() {
        const gameName = gameNameInput.value.trim();
        if (gameName === "") {
            if (confirm("Название игры не указано. Сохранить как «Без названия»?")) {
                // продолжаем
            } else {
                return;
            }
        }
        const success = addCurrentReview();
        if (success) {
            alert("✅ Оценка сохранена! Перейдите на вкладку «Сохранённые обзоры».");
            // если пользователь захочет сразу увидеть, можно переключить, но не принудительно
        } else {
            alert("Ошибка: не удалось сохранить оценку.");
        }
    }

    // сброс на 0.5
    function resetToDefault() {
        setAllValuesTo(0.5);
    }

    // инициализация событий и кнопок
    function initEventHandlers() {
        const resetBtn = document.getElementById("resetAllBtn");
        if (resetBtn) resetBtn.addEventListener('click', resetToDefault);
        const saveBtn = document.getElementById("saveReviewBtn");
        if (saveBtn) saveBtn.addEventListener('click', handleSaveReview);
        const clearAllBtn = document.getElementById("clearAllReviewsBtn");
        if (clearAllBtn) clearAllBtn.addEventListener('click', clearAllReviews);
        // переключение табов
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tabId = btn.getAttribute('data-tab');
                if (tabId) activateTab(tabId);
            });
        });
    }

    // начальная загрузка
    function init() {
        buildRatingInterface();           // создаем ползунки
        initEventHandlers();              // кнопки, табы
        // загружаем сохранёнки для отображения, если позже переключатся
        renderSavedReviews();             // для инициализации контейнера
        // По умолчанию активна вкладка rating, но также проверяем, что в tabSaved все готово
        // Дополнительно синхронизируем
        const firstActiveTab = document.querySelector('.tab-btn.active');
        if (firstActiveTab) {
            const activeTabId = firstActiveTab.getAttribute('data-tab');
            if (activeTabId !== 'tabRating') activateTab('tabRating');
        } else {
            activateTab('tabRating');
        }
    }

    // Доп. функция для обновления дисплеев после возможных внешних изменений
    window.addEventListener('load', () => {
        init();
    });
</script>
</body>
</html>
